  [x-cloak]{display:none!important}

  /* Progress bar */
  #progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#F2A23A,#4EC39A);z-index:200;transition:width .1s linear;border-radius:0 2px 2px 0;box-shadow:0 0 18px rgba(242,162,58,.25)}

  /* Accordion animation */
  .accordion-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .65s cubic-bezier(0.4,0,0.2,1), opacity .5s ease .1s;
    opacity:0;
    will-change:grid-template-rows,opacity;
  }
  .accordion-body.open{
    grid-template-rows:1fr;
    opacity:1;
  }
  .accordion-body > div{overflow:hidden}

  /* Dot pulse */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .dot-pulse{animation:pulse 2s infinite}

  /* Fade in on scroll */
  .fade-in{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .fade-in.visible{opacity:1;transform:translateY(0)}

  .whatsapp-link{border-color:rgba(37,211,102,.34);background:rgba(37,211,102,.055);color:#F4F0E8}
  .whatsapp-link:hover{border-color:#7BE3A2;color:#7BE3A2}

  /* RTL global text alignment */
  [dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{text-align:right}
  [dir="rtl"] .rtl-text{text-align:right}
  [dir="rtl"] ul{padding-right:0}

  /* Reduced motion — accessibility */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
    .fade-in{opacity:1;transform:none}
  }
</style>

<!-- SERVICES -->
<section id="services" class="max-w-2xl mx-auto px-5 pt-8 pb-0 fade-in">
  <div class="flex flex-col gap-3" id="cards-container"
    style="scroll-snap-type:y proximity">
    <template x-for="(card, i) in t.cards" :key="card.id">
      <div
        :id="'card-'+card.id"
        :data-card-id="card.id"
        class="rounded-2xl border bg-bg2 transition-all duration-300 overflow-hidden"
        :class="openCards.includes(card.id) ? (card.color==='acc2' ? 'border-acc2/60' : card.color==='acc3' ? 'border-acc3/60' : 'border-acc/60') : 'border-white/8'"
        style="scroll-snap-align:start;scroll-margin-top:70px"
      >
        <!-- Header — diagonal image left, text right -->
        <div class="relative cursor-pointer overflow-hidden flex items-center" style="min-height:120px" @click="toggleCard(card.id)">
          <!-- Image with smooth gradient fade — no visible edge -->
          <div class="absolute inset-0">
            <img
              :src="cardImages[card.id]"
              @error="$el.src = cardFallback[card.id]"
              class="w-full h-full object-cover object-center"
              :alt="card.h"
              loading="lazy"
            >
          </div>
          <!-- Multi-stop gradient — smooth invisible fade -->
          <div class="absolute inset-0" style="background:linear-gradient(to right, rgba(8,10,13,0) 0%, rgba(8,10,13,0.18) 25%, rgba(8,10,13,0.64) 42%, rgba(8,10,13,0.9) 52%, rgba(8,10,13,0.98) 60%, rgba(8,10,13,1) 70%)"></div>

          <!-- Text — right side -->
          <div class="relative z-10 flex items-center justify-between w-full px-5 py-5 gap-3"
            :class="dir==='rtl' ? 'flex-row-reverse' : ''">
            <div class="flex-1" :class="dir==='rtl'?'text-right':''">
              <span class="inline-flex pb-1 text-[18px] font-semibold tracking-wide mb-2"
                :class="card.color==='acc2' ? 'text-acc2 border-b border-acc2/70' : card.color==='acc3' ? 'text-acc3 border-b border-acc3/70' : 'text-acc border-b border-acc/70'"
                x-text="card.tag"></span>
              <span class="text-[18px] font-bold text-white block leading-tight" x-text="card.h"></span>
            </div>
            <svg class="w-5 h-5 flex-shrink-0 transition-transform duration-500"
              :class="[openCards.includes(card.id) ? 'rotate-180' : '', card.color==='acc2' ? 'text-acc2' : card.color==='acc3' ? 'text-acc3' : 'text-acc']"
              fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <!-- Body — accordion -->
        <div
          class="accordion-body"
          :class="openCards.includes(card.id) ? 'open' : ''"
        >
          <div>
            <div class="px-5 pb-6" :class="dir==='rtl'?'text-right':''">
              <p class="text-lg leading-relaxed mb-5" style="color:#D6CEC4" x-text="card.p"></p>
              <!-- Grid items (servers/partners style) -->
              <template x-if="card.grid">
                <div class="flex flex-col gap-3">
                  <template x-for="item in card.grid" :key="item[0]">
                    <div class="rounded-xl border border-white/8 bg-bg4 px-4 py-3" :class="dir==='rtl'?'text-right':''">
                      <h4 class="text-lg font-bold text-tx mb-1" x-text="item[0]"></h4>
                      <p class="text-base leading-relaxed" style="color:#C4BAB0" x-text="item[1]"></p>
                    </div>
                  </template>
                </div>
              </template>
              <!-- Regular list items -->
              <template x-if="!card.grid">
                <ul class="flex flex-col gap-4">
                  <template x-for="item in card.li" :key="item">
                    <li class="text-lg leading-relaxed" style="color:#D6CEC4" :class="dir==='rtl' ? 'text-right' : 'flex items-start gap-3'">
                      <template x-if="dir!=='rtl'">
                        <span class="text-acc flex-shrink-0 mt-1 text-xl">•</span>
                      </template>
                      <span x-text="(dir==='rtl' ? '• ' : '') + item"></span>
                    </li>
                  </template>
                </ul>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</section>

      he:{dir:'rtl',lang:'he',h1:'אנחנו מסדרים.<br><em class="text-acc not-italic">אתם יוצרים.</em>',hsub:'הקמת IT למשרדים, תמיכה מרחוק, שרתים ותשתיות עבור משרדי עורכי דין, ביטוח, פיננסים ועסקים קטנים.',b1:'צרו קשר',cards:[{id:'pc',tag:'שירותים נפוצים',h:'הגדרת מחשב',p:'תיקונים, שידרוגים וייעוץ למחשבים ביתיים ומשרדיים',li:['הגדרת Windows / macOS','התקנה ורישוי תוכנות','רשת ומדפסות','העברת נתונים']},{id:'office',tag:'שירות מקיף למשרד',h:'משרד עד המפתח',p:'משרד חדש? הגדרה/התקנת כל הנדרש לתחילת עבודה מיידית',li:['תחנות עבודה לכל העובדים','תשתית רשת ו-Wi-Fi','אימייל, ענן, כוננים משותפים','אבטחה וגיבויים']},{id:'remote',tag:'שירות שוטף קבוע',h:'תמיכה מרחוק',p:'עזרה מהירה לכל בעיית IT, בלי להמתין לביקור',li:['כל מערכת הפעלה, כל מכשיר','וירוסים, האטות, קריסות','זמין כתוכנית חודשית']},{id:'studio',tag:'סטודיו & קריאייטיב',h:'שירותי IT לסטודיו',p:'התקנה, שדרוג והגדרת תוכנות מקצועיות לסטודיו',li:['Cubase · Ableton · Logic Pro','Adobe Premiere · After Effects','Photoshop · Illustrator','אופטימיזציה של המחשב לביצועים מקסימליים']},{id:'servers',color:'acc2',tag:'תשתיות',h:'שרתים ורשתות',p:'תשתית רצינית לעסקים שצריכים אמינות, אבטחה ושליטה מלאה בנתונים שלהם.',grid:[['שרתי קבצים','אחסון מרכזי, גישה, גיבויים'],['Active Directory','משתמשים, דומיין, מדיניות'],['VPN ואבטחה','גישה מרחוק, חומת אש'],['ענן והיברידי','Microsoft 365, Azure, Google'],['מצלמות אבטחה','מצלמות, NVR, צפייה מרחוק'],['תשתית כבלים','תשתית קווית נקייה ואמינה']]},{id:'partners',color:'acc3',tag:'שיתופי פעולה',h:'שירותי שותפים',p:'אני עובד עם מומחים מוכרים — אתם מקבלים איש קשר אחד ותוצאה מתואמת.',grid:[['🌐 אתרים ודפי נחיתה','אתרים מודרניים רב-לשוניים'],['📞 טלפוניית IP','מרכזייה וירטואלית, קווי SIP'],['🖨️ מדפסות ו-MFP','אספקה, הגדרה, תחזוקה'],['🔒 בקרת כניסה','מנעולים חכמים, אינטרקום']]}],ch2:'מוכנים להתחיל?',waText:'כתבו לנו ב-WhatsApp',foot:'© 2025 itseder.com · אלכסיי פבלנקו · ישראל'}
    },

    get t(){ return this.T[this.lang] },

    init(){
      this.setLang('he');
      this.$nextTick(()=>{
        this.initFadeIn();
      });
    },

    setLang(l){
      this.lang = l;
      this.dir = this.T[l].dir;
      this.openCards = [];
      this._scrollStarted = false;
      this._lastOpenedIndex = -1;
      this._reachedBottom = false;
    },

    scrollTop(){
      window.scrollTo({top:0, behavior:'smooth'});
    },

    scrollToBottom(){
      this._scrolling = true;
      window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
      const onScrollEnd = () => {
        this._scrolling = false;
        this._reachedBottom = true;
        this.openCards = [];
        window.removeEventListener('scrollend', onScrollEnd);
      };
      window.addEventListener('scrollend', onScrollEnd);
      // fallback для браузеров без scrollend
      setTimeout(() => {
        this._scrolling = false;
        this._reachedBottom = true;
        this.openCards = [];
        window.removeEventListener('scrollend', onScrollEnd);
      }, 1500);
    },

    toggleCard(id){
      const idx = this.openCards.indexOf(id);
      if(idx !== -1){
        this.openCards.splice(idx, 1);
      } else {
        this.openCards.push(id);
      }
    },

    onScroll(){
      if(this._scrolling) return;
      const scrollTop = window.scrollY;
      const docH = document.documentElement.scrollHeight - window.innerHeight;
      this.progress = docH > 0 ? (scrollTop/docH)*100 : 0;

      if(docH <= 5) return;
      const atTop = scrollTop <= 5;

      if(atTop){
        this._reachedBottom = false;
        this._lastOpenedIndex = -1;
      }

      this._scrollStarted = scrollTop > 5;

      if(!this._scrollStarted){
        this.openCards = [];
        this._lastOpenedIndex = -1;
        return;
      }

      if(this._reachedBottom){
        return;
      }

      const cards = this.t.cards;
      const count = this._scrollCardCount();

      for(let i = 0; i < count; i++){
        if(!this.openCards.includes(cards[i].id)){
          this.openCards.push(cards[i].id);
        }
      }
      this._lastOpenedIndex = Math.max(this._lastOpenedIndex, count - 1);

      for(let i = count; i < cards.length; i++){
        const ci = this.openCards.indexOf(cards[i].id);
        if(ci !== -1){
          this.openCards.splice(ci, 1);
        }
      }
      if(count <= this._lastOpenedIndex){
        this._lastOpenedIndex = count - 1;
      }

      const atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 5;
      if(atBottom){
        this._reachedBottom = true;
        this.openCards = [];
        this._lastOpenedIndex = -1;
      }
    },

    _scrollCardCount(){
      const scrollTop = window.scrollY;
      const vh = window.innerHeight;
      const cards = this.t.cards;
      let count = 0;
      for(let i = 0; i < cards.length; i++){
        const el = document.querySelector(`[data-card-id="${cards[i].id}"]`);
        if(!el) break;
        const top = el.getBoundingClientRect().top + scrollTop;
        if(top < scrollTop + vh){
          count++;
        } else {
          break;
        }
      }
      return count;
    },

    initFadeIn(){
      const observer = new IntersectionObserver((entries)=>{
        entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
      },{threshold:0.1});
      document.querySelectorAll('.fade-in').forEach(el=>observer.observe(el));
    }
  }
}
</script>
