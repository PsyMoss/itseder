<style>
  [x-cloak]{display:none!important}
  html{scroll-behavior:smooth}
  body{background:#0F0E0C;color:#DDD5C8;font-family:'Inter',system-ui,sans-serif}

  /* Progress bar */
  #progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#E8931E,#4A9E7A);z-index:200;transition:width .1s linear;border-radius:0 2px 2px 0}

  /* Accordion animation */
  .accordion-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .65s cubic-bezier(0.4,0,0.2,1), opacity .5s ease .1s;
    opacity:0;
  }
  .accordion-body.open{
    grid-template-rows:1fr;
    opacity:1;
  }
  .accordion-body > div{overflow:hidden}

  /* Dot pulse */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .dot-pulse{animation:pulse 2s infinite}

  /* Fade in on scroll */
  .fade-in{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .fade-in.visible{opacity:1;transform:translateY(0)}

  /* RTL global text alignment */
  [dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{text-align:right}
  [dir="rtl"] .rtl-text{text-align:right}
  [dir="rtl"] ul{padding-right:0}
</style>

    style="scroll-snap-type:y proximity">
    <template x-for="(card, i) in t.cards" :key="card.id">
      <div
        :id="'card-'+card.id"
        class="rounded-2xl border bg-bg2 transition-all duration-300 overflow-hidden"
        :class="openCard===card.id ? 'border-acc/60' : nextCard===card.id ? 'border-acc/20' : 'border-white/8'"
        style="scroll-snap-align:start;scroll-margin-top:70px"
        x-data="{get isOpen(){return $root.__x.$data.openCard===card.id}}"
      >
        <!-- Invisible trigger for IntersectionObserver -->
        <div class="card-trigger h-px w-full" :data-card-id="card.id"></div>
        <!-- Header — diagonal image left, text right -->
        <div class="relative cursor-pointer overflow-hidden flex items-center" style="min-height:120px" @click="toggleCard(card.id)">
          <!-- Image with smooth gradient fade — no visible edge -->
          <div class="absolute inset-0">
            <img
              :src="cardImages[card.id]"
              :onerror="`this.src='${cardFallback[card.id]}'`"
              class="w-full h-full object-cover object-center"
              :alt="card.h"
              loading="lazy"
            >
          </div>
          <!-- Multi-stop gradient — smooth invisible fade -->
          <div class="absolute inset-0" style="background:linear-gradient(to right, rgba(15,14,12,0) 0%, rgba(15,14,12,0.15) 25%, rgba(15,14,12,0.6) 42%, rgba(15,14,12,0.88) 52%, rgba(15,14,12,0.98) 60%, rgba(15,14,12,1) 70%)"></div>

          <!-- Text — right side -->
          <div class="relative z-10 flex items-center justify-between w-full px-5 py-5 gap-3"
            :class="dir==='rtl' ? 'flex-row-reverse' : ''">
            <div class="flex-1" :class="dir==='rtl'?'text-right':''">

            </div>
            <svg class="w-5 h-5 text-acc flex-shrink-0 transition-transform duration-500"
              :class="openCard===card.id ? 'rotate-180' : ''"
              fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <!-- Body — accordion -->
        <div
          class="accordion-body"
          :class="openCard===card.id ? 'open' : ''"
        >
          <div>
            <div class="px-5 pb-6" :class="dir==='rtl'?'text-right':''">
              <p class="text-lg leading-relaxed mb-5" style="color:#C4BAB0" x-text="card.p"></p>

                  </li>
                </template>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </template>

</section>

    get t(){ return this.T[this.lang] },

    init(){
      this.setLang('he');
      this.$nextTick(()=>{
        this.initFadeIn();
        this.initScrollAccordion();
      });
    },

    setLang(l){
      this.lang = l;
      this.dir = this.T[l].dir;
      document.documentElement.lang = l;
      document.documentElement.dir = this.T[l].dir;
      this.openCard = null;
      this.$nextTick(()=>{
        this.initScrollAccordion();
      });
    },

    scrollTop(){
      window.scrollTo({top:0, behavior:'smooth'});
    },

    scrollTo(id){
      const el = document.getElementById(id);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    },

    scrollToCard(id){
      if(!id) return;
      const el = document.getElementById('card-'+id);
      if(!el) return;
      this.openCard = id;
      this.scrollingLocked = true;
      clearTimeout(this.scrollLockTimer);
      this.scrollLockTimer = setTimeout(()=>{ this.scrollingLocked=false; }, 1000);
      this.$nextTick(()=>{
        setTimeout(()=>{
          const rect = el.getBoundingClientRect();
          const cardCenter = rect.top + rect.height/2;
          const screenCenter = window.innerHeight/2;
          const offset = window.scrollY + (cardCenter - screenCenter);
          window.scrollTo({top: offset, behavior:'smooth'});
        }, 50);
      });
    },

    toggleCard(id){
      this.openCard = this.openCard === id ? null : id;
      this.nextCard = null;
    },

    onScroll(){
      const scrollTop = window.scrollY;
      const docH = document.documentElement.scrollHeight - window.innerHeight;
      this.progress = docH > 0 ? (scrollTop/docH)*100 : 0;
      if(window.innerWidth >= 768 || this.scrollingLocked) return;
      this._updateActiveCard();
    },

    _updateActiveCard(){
      const vh = window.innerHeight;
      const allCards = document.querySelectorAll('[id^="card-"]');
      let activeIdx = -1;
      allCards.forEach((card, i) => {
        const rect = card.getBoundingClientRect();
        const top = rect.top / vh;
        if(top >= 0.3 && top <= 0.7 && activeIdx === -1) activeIdx = i;
      });
      if(activeIdx !== -1){
        const newId = allCards[activeIdx].id.replace('card-','');
        if(this.openCard !== newId) this.openCard = newId;
        // подсвечиваем следующую
        const nextEl = allCards[activeIdx + 1];
        this.nextCard = nextEl ? nextEl.id.replace('card-','') : null;
      }
    },

    initFadeIn(){
      const observer = new IntersectionObserver((entries)=>{
        entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
      },{threshold:0.1});
      document.querySelectorAll('.fade-in').forEach(el=>observer.observe(el));
    },

    initScrollAccordion(){
      if(window.innerWidth >= 768) return;
      if(this.t.cards.length > 0) this.openCard = this.t.cards[0].id;
      setTimeout(()=>this._updateActiveCard(), 200);
    }
  }
}
