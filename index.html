<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F0E0C;--bg2:#141210;--bg3:#1C1916;--bg4:#242018;
  --acc:#E8924A;--acc2:#4A9E7A;--acc3:#7A8EE8;
  --text:#F0EBE3;--muted:#9A9188;
  --border:rgba(255,255,255,0.08);
  --border-acc:rgba(232,146,74,0.25);
  --border-grn:rgba(74,158,122,0.25);
  --border-blu:rgba(122,142,232,0.25);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.65;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}

/* ── NAV ── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.25rem;
  background:rgba(15,14,12,0.97);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.logo{font-family:'Syne',system-ui,sans-serif;font-size:1.4rem;font-weight:700;color:var(--text);letter-spacing:-.02em}
.logo em{color:var(--acc);font-style:normal}
.langs{display:flex;gap:6px}
.lb{padding:7px 14px;border:1px solid var(--border);background:transparent;border-radius:20px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--muted);transition:all .2s;-webkit-tap-highlight-color:transparent;min-height:44px}
.lb.on{background:var(--acc);color:#0F0E0C;border-color:var(--acc);font-weight:500}

/* ── HERO — always centered ── */
.hero{padding:3.5rem 1.25rem 2.5rem;max-width:820px;margin:0 auto;text-align:center;position:relative}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(500px,100%);height:240px;background:radial-gradient(ellipse,rgba(232,146,74,.07) 0%,transparent 70%);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border-acc);border-radius:24px;padding:6px 16px;font-size:12px;color:var(--acc);margin-bottom:1.5rem;letter-spacing:.05em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-family:'Syne',system-ui,sans-serif;font-size:clamp(2rem,6vw,3rem);font-weight:700;line-height:1.2;letter-spacing:-.02em;margin-bottom:1.1rem}
h1 em{color:var(--acc);font-style:normal}
.hero-sub{font-size:clamp(1rem,3vw,1.05rem);color:var(--muted);line-height:1.8;max-width:520px;margin:0 auto 2rem;font-weight:300}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bp{padding:15px 28px;background:var(--acc);color:#0F0E0C;border:none;border-radius:10px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:50px}
.bs{padding:15px 28px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:50px}

/* ── WHO — always centered ── */
.who{padding:.5rem 1.25rem 2rem;max-width:820px;margin:0 auto;text-align:center}
.who-p{font-size:12px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:.9rem}
.who-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wtag{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;color:var(--muted)}
.wtag-link{transition:all .2s;border-color:rgba(232,146,74,.3) !important}
.wtag-link:hover{background:rgba(232,146,74,.12) !important;border-color:var(--acc) !important;color:var(--acc) !important}
.sep{border:none;border-top:1px solid var(--border);margin:0 1.25rem}

/* ── WRAP — text direction from body ── */
.wrap{padding:2.5rem 1.25rem;max-width:820px;margin:0 auto}
.slabel{font-size:11px;letter-spacing:.1em;color:var(--acc);text-transform:uppercase;margin-bottom:.7rem;font-weight:500;display:block}
.slabel.grn{color:var(--acc2)}
.slabel.blu{color:var(--acc3)}
.stitle{font-family:'Syne',system-ui,sans-serif;font-size:clamp(1.5rem,4vw,1.9rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1.5rem}

/* ── CORE CARDS ── */
.core-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:600px){.core-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.75rem 1.5rem}
.sc-tag{
  display:inline-block;
  padding:5px 13px;
  border-radius:6px;
  font-size:12px;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:.9rem;
  font-weight:600;
  background:transparent;
  color:var(--acc);
  border:1.5px solid var(--acc);
}
.scard h3{font-size:16px;font-weight:500;margin-bottom:6px;color:var(--text)}
.scard p{font-size:15px;color:#C4BAB0;line-height:1.7;font-weight:400}
.scard ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.scard ul li{font-size:14px;color:var(--muted);line-height:1.5;display:flex;align-items:flex-start;gap:8px}
.scard ul li::before{content:'→';color:var(--acc);flex-shrink:0;font-size:14px}

/* ── SERVER ── */
.server-block{background:var(--bg3);border:1px solid var(--border-grn);border-radius:14px;padding:1.5rem}
.server-desc{font-size:14px;color:var(--muted);line-height:1.7;font-weight:300;margin-bottom:1.1rem}
.server-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.server-grid{grid-template-columns:repeat(3,1fr)}}
.srv-item{background:var(--bg4);border:1px solid var(--border);border-radius:10px;padding:1rem}
.srv-item h4{font-size:14px;font-weight:500;margin-bottom:4px;color:var(--text)}
.srv-item p{font-size:13px;color:var(--muted);line-height:1.5;font-weight:300}

/* ── PARTNER ── */
.partner-block{background:var(--bg3);border:1px solid var(--border-blu);border-radius:14px;padding:1.5rem}
.partner-note{font-size:14px;color:var(--muted);line-height:1.7;font-weight:300;margin-bottom:1.2rem}
.partner-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:500px){.partner-grid{grid-template-columns:1fr 1fr}}
/* pcard: icon + text, direction-aware */
.pcard{background:var(--bg4);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:flex;align-items:flex-start;gap:12px}
.p-icon{width:36px;height:36px;border-radius:8px;background:rgba(122,142,232,.1);border:1px solid var(--border-blu);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pcard-text{flex:1;min-width:0}
.pcard-text h4{font-size:15px;font-weight:500;margin-bottom:3px;color:var(--text)}
.pcard-text p{font-size:13px;color:var(--muted);line-height:1.5;font-weight:300}

/* ── ABON ── */
.abon{background:linear-gradient(135deg,rgba(232,146,74,.08) 0%,rgba(74,158,122,.06) 100%);border:1px solid var(--border-acc);border-radius:14px;padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem}
@media(min-width:560px){.abon{flex-direction:row;align-items:center;flex-wrap:wrap}}
.abon-text{flex:1;min-width:0}
.abon-text h3{font-family:'Syne',system-ui,sans-serif;font-size:1.25rem;font-weight:700;margin-bottom:.5rem}
.abon-text p{font-size:14px;color:var(--muted);line-height:1.7;font-weight:300}
.abon-badge{background:var(--acc);color:#0F0E0C;border-radius:10px;padding:1rem 1.3rem;text-align:center;align-self:flex-start}
@media(min-width:560px){.abon-badge{flex-shrink:0;align-self:center}}
.ab-label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.ab-val{font-family:'Syne',system-ui,sans-serif;font-size:1.05rem;font-weight:700}

/* ── WHY ── */
#cl5{font-size:clamp(1.5rem,4vw,1.9rem);font-weight:700;letter-spacing:-.02em;color:var(--acc);text-transform:none;font-family:'Syne',system-ui,sans-serif}
.why-inner{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:1.75rem}
.why-header{margin-bottom:1.25rem}
.why-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
@media(min-width:500px){.why-grid{grid-template-columns:1fr 1fr}}
.wi{padding:1.1rem 1.2rem;background:var(--bg2);display:flex;align-items:flex-start;gap:12px}
.wi-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.wi-body{flex:1;min-width:0}
.wi-body h4{font-size:15px;font-weight:500;margin-bottom:4px;color:var(--text)}
.wi-body p{font-size:13px;color:var(--muted);line-height:1.6;font-weight:300}
.wi.full{grid-column:1/-1;background:var(--bg3);border-top:1px solid var(--border-acc)}
.wi.full .wi-body h4{color:var(--acc);font-size:15px}
.wi.full .wi-body p{font-size:14px}

/* ── CONTACT — always centered ── */
.contact-card{background:var(--bg3);border:1px solid var(--border-acc);border-radius:16px;padding:2.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.contact-card::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(232,146,74,.05) 0%,transparent 70%);pointer-events:none}
.contact-card::after{content:'';position:absolute;bottom:-80px;right:-80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(74,158,122,.07) 0%,transparent 70%)}
.contact-card h2{font-family:'Syne',system-ui,sans-serif;font-size:clamp(1rem,3vw,1.2rem);font-weight:400;letter-spacing:.02em;margin-bottom:1.5rem;color:var(--muted)}
.contact-card>p{font-size:15px;color:var(--muted);margin-bottom:2rem;line-height:1.75;font-weight:300}
.cname{font-family:'Syne',system-ui,sans-serif;font-size:clamp(1.8rem,6vw,2.4rem);font-weight:700;color:var(--text);margin-bottom:1rem;letter-spacing:-.02em}
.ltags{display:flex;gap:8px;justify-content:center;margin-bottom:2rem}
.ltag{background:var(--bg4);border:1px solid var(--border-acc);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--acc);letter-spacing:.06em;font-weight:500}
.clinks{display:flex;flex-direction:column;gap:10px;width:100%;position:relative;z-index:1}
.clink{display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;color:var(--text);transition:all .2s;min-height:52px;background:var(--bg4);border:1px solid var(--border);border-radius:12px;padding:.9rem 1.2rem;text-decoration:none;text-align:center}
.clink:hover{border-color:var(--acc);color:var(--acc);background:var(--bg3)}
.ci{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg3);border:1px solid var(--border);flex-shrink:0}
.clink-label{display:none}
.clink-val{font-size:16px;font-weight:400}
.wa-clink{border-color:rgba(37,211,102,0.3) !important;background:rgba(37,211,102,0.06) !important}
.wa-clink:hover{border-color:#25D366 !important;color:#25D366 !important;background:rgba(37,211,102,0.12) !important}
.wa-ci{background:#25D366 !important;border-color:#25D366 !important}
footer{text-align:center;padding:1.75rem 1.25rem;font-size:13px;color:var(--muted);border-top:1px solid var(--border);line-height:1.6}

/* ── PROGRESS BAR ── */
.progress-bar{
  position:fixed;top:0;left:0;z-index:200;
  height:3px;width:0%;
  background:linear-gradient(90deg, var(--acc), var(--acc2));
  transition:width .1s linear;
  border-radius:0 2px 2px 0;
}
.wa-btn{
  position:fixed;bottom:24px;left:24px;z-index:999;
  width:58px;height:58px;border-radius:50%;
  background:#25D366;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(37,211,102,.4);
  cursor:pointer;text-decoration:none;
  transition:transform .2s,box-shadow .2s;
  animation:wa-pulse 2.5s infinite;
}
.wa-btn:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(37,211,102,.55)}
.wa-btn svg{width:30px;height:30px;fill:#fff}
@keyframes wa-pulse{
  0%,100%{box-shadow:0 4px 20px rgba(37,211,102,.4)}
  50%{box-shadow:0 4px 28px rgba(37,211,102,.7),0 0 0 8px rgba(37,211,102,.1)}
}
.wa-tooltip{
  position:fixed;bottom:32px;left:90px;z-index:998;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;
  font-size:13px;color:var(--text);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.wa-btn{
  position:fixed;bottom:24px;left:24px;z-index:999;
  width:58px;height:58px;border-radius:50%;
  background:#25D366;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(37,211,102,.4);
  cursor:pointer;text-decoration:none;
  transition:transform .2s,box-shadow .2s;

}
.wa-btn:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(37,211,102,.55)}
.wa-btn svg{width:30px;height:30px;fill:#fff}

}

  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;
  font-size:13px;color:var(--text);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.wa-btn:hover + .wa-tooltip{opacity:1}

/* ════════════════════════
   RTL — direction:rtl on body handles text automatically.
   We only need to flip flex rows.
   ════════════════════════ */
[dir="rtl"] .pcard{flex-direction:row-reverse;text-align:right}
[dir="rtl"] .pcard-text{text-align:right}
[dir="rtl"] .wi{flex-direction:row-reverse}
[dir="rtl"] .abon{flex-direction:row-reverse}
[dir="rtl"] .abon-text{text-align:right}
[dir="rtl"] .abon-text h3{text-align:right}
[dir="rtl"] .abon-text p{text-align:right}
[dir="rtl"] .clink{flex-direction:row-reverse}
/* sc-tag: own line, right-aligned */
[dir="rtl"] .sc-tag{display:block;text-align:right;float:none;margin-bottom:.9rem}
/* list items RTL: full width, text right, colored dot on right */
[dir="rtl"] .scard ul li{display:block;text-align:right;padding-right:16px;position:relative}
[dir="rtl"] .scard ul li::before{content:'•';color:var(--acc);position:absolute;right:0;top:0}
[dir="rtl"] .scard::after{content:'';display:table;clear:both}
/* nav: logo stays left, langs right — keep as-is for brand */

function scrollToCard(id){

    setTimeout(function(){el.style.borderColor='';},1500);
  }
}
