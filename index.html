<head>
<meta charset="UTF-8">

<title>itseder — IT solutions · Israel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F0E0C;--bg2:#141210;--bg3:#1C1916;--bg4:#242018;
  --acc:#E8924A;--acc2:#4A9E7A;--acc3:#7A8EE8;
  --text:#F0EBE3;--muted:#9A9188;
  --border:rgba(255,255,255,0.08);
  --border-acc:rgba(232,146,74,0.25);
  --border-grn:rgba(74,158,122,0.25);
  --border-blu:rgba(122,142,232,0.25);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body[dir="rtl"]{font-family:'Inter',system-ui,-apple-system,'Segoe UI','Arial Hebrew',sans-serif}
a{color:inherit;text-decoration:none}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.25rem;
  background:rgba(15,14,12,0.97);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.logo{font-family:'Syne',system-ui,sans-serif;font-size:1.4rem;font-weight:700;color:var(--text);letter-spacing:-.02em}
.logo em{color:var(--acc);font-style:normal}
.langs{display:flex;gap:6px}
.lb{
  padding:7px 14px;
  border:1px solid var(--border);background:transparent;
  border-radius:20px;font-size:13px;font-family:inherit;
  cursor:pointer;color:var(--muted);transition:all .2s;
  -webkit-tap-highlight-color:transparent;min-height:44px;
}
.lb.on{background:var(--acc);color:#0F0E0C;border-color:var(--acc);font-weight:500}

/* HERO */
.hero{padding:3.5rem 1.25rem 2.5rem;max-width:820px;margin:0 auto;text-align:center;position:relative}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(500px,100%);height:240px;background:radial-gradient(ellipse,rgba(232,146,74,.07) 0%,transparent 70%);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border-acc);border-radius:24px;padding:6px 16px;font-size:12px;color:var(--acc);margin-bottom:1.5rem;letter-spacing:.05em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-family:'Syne',system-ui,sans-serif;font-size:clamp(2rem,6vw,3rem);font-weight:700;line-height:1.15;letter-spacing:-.02em;margin-bottom:1.1rem}
h1 em{color:var(--acc);font-style:normal}
.hero-sub{font-size:clamp(1rem,3vw,1.05rem);color:var(--muted);line-height:1.8;max-width:520px;margin:0 auto 2rem;font-weight:300}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bp{padding:15px 28px;background:var(--acc);color:#0F0E0C;border:none;border-radius:10px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .2s;-webkit-tap-highlight-color:transparent;min-height:50px}
.bp:hover{opacity:.85}
.bs{padding:15px 28px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;min-height:50px}
.bs:hover{border-color:var(--acc);color:var(--acc)}

/* WHO */
.who{padding:.5rem 1.25rem 2rem;max-width:820px;margin:0 auto;text-align:center}
.who-p{font-size:12px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:.9rem}
.who-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wtag{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;color:var(--muted)}

.sep{border:none;border-top:1px solid var(--border);margin:0 1.25rem}

/* SECTIONS */
.wrap{padding:2.5rem 1.25rem;max-width:820px;margin:0 auto}
.slabel{font-size:11px;letter-spacing:.1em;color:var(--acc);text-transform:uppercase;margin-bottom:.7rem;font-weight:500;display:block}
.slabel.grn{color:var(--acc2)}
.slabel.blu{color:var(--acc3)}
.stitle{font-family:'Syne',system-ui,sans-serif;font-size:clamp(1.5rem,4vw,1.9rem);font-weight:700;letter-spacing:-.02em;margin-bottom:1.5rem}

/* CORE CARDS */
.core-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.core-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.4rem;transition:border-color .2s}
.scard:hover{border-color:var(--border-acc)}
.sc-tag{display:inline-block;padding:4px 11px;border-radius:5px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.9rem;font-weight:500;background:rgba(232,146,74,.13);color:var(--acc)}
.scard h3{font-size:16px;font-weight:500;margin-bottom:6px;color:var(--text)}
.scard p{font-size:14px;color:var(--muted);line-height:1.65;font-weight:300}
.scard ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:7px}
.scard ul li{font-size:14px;color:var(--muted);display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.scard ul li::before{content:'→';color:var(--acc);flex-shrink:0;font-size:14px}
[dir="rtl"] .scard ul li{flex-direction:row-reverse}
[dir="rtl"] .scard ul li::before{content:'←'}

/* SERVER BLOCK */
.server-block{background:var(--bg3);border:1px solid var(--border-grn);border-radius:14px;padding:1.5rem}
.server-desc{font-size:14px;color:var(--muted);line-height:1.7;font-weight:300;margin-bottom:1.1rem}
.server-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.server-grid{grid-template-columns:repeat(3,1fr)}}
.srv-item{background:var(--bg4);border:1px solid var(--border);border-radius:10px;padding:1rem}
.srv-item h4{font-size:14px;font-weight:500;margin-bottom:4px;color:var(--text)}
.srv-item p{font-size:13px;color:var(--muted);line-height:1.5;font-weight:300}

/* PARTNER */
.partner-block{background:var(--bg3);border:1px solid var(--border-blu);border-radius:14px;padding:1.5rem}
.partner-note{font-size:14px;color:var(--muted);line-height:1.7;font-weight:300;margin-bottom:1.2rem}
.partner-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:500px){.partner-grid{grid-template-columns:1fr 1fr}}
.pcard{background:var(--bg4);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:flex;align-items:flex-start;gap:12px}
.p-icon{width:36px;height:36px;border-radius:8px;background:rgba(122,142,232,.1);border:1px solid var(--border-blu);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pcard h4{font-size:15px;font-weight:500;margin-bottom:3px;color:var(--text)}
.pcard p{font-size:13px;color:var(--muted);line-height:1.5;font-weight:300}

/* ABON */
.abon{background:linear-gradient(135deg,rgba(232,146,74,.08) 0%,rgba(74,158,122,.06) 100%);border:1px solid var(--border-acc);border-radius:14px;padding:1.5rem;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.abon-text{flex:1;min-width:200px}
.abon-text h3{font-family:'Syne',system-ui,sans-serif;font-size:1.25rem;font-weight:700;margin-bottom:.5rem}
.abon-text p{font-size:14px;color:var(--muted);line-height:1.7;font-weight:300}
.abon-badge{background:var(--acc);color:#0F0E0C;border-radius:10px;padding:1rem 1.3rem;text-align:center;flex-shrink:0}
.ab-label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.ab-val{font-family:'Syne',system-ui,sans-serif;font-size:1.05rem;font-weight:700}

/* WHY */
.why-inner{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:1.75rem}
.why-header{margin-bottom:1.25rem}
.why-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
@media(min-width:500px){.why-grid{grid-template-columns:1fr 1fr}}
.wi{padding:1.1rem 1.2rem;background:var(--bg2);display:flex;gap:12px;align-items:flex-start}
.wi-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.wi-body h4{font-size:15px;font-weight:500;margin-bottom:4px;color:var(--text)}
.wi-body p{font-size:13px;color:var(--muted);line-height:1.6;font-weight:300}
.wi.full{grid-column:1/-1;background:var(--bg3);border-top:1px solid var(--border-acc)}
.wi.full .wi-body h4{color:var(--acc);font-size:15px}
.wi.full .wi-body p{font-size:14px}
[dir="rtl"] .wi{flex-direction:row-reverse}

/* CONTACT */
.contact-card{background:var(--bg3);border:1px solid var(--border-acc);border-radius:14px;padding:2.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.contact-card::after{content:'';position:absolute;bottom:-80px;right:-80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(74,158,122,.08) 0%,transparent 70%)}
.contact-card h2{font-family:'Syne',system-ui,sans-serif;font-size:clamp(1.5rem,4vw,2rem);font-weight:700;letter-spacing:-.02em;margin-bottom:.7rem}
.contact-card>p{font-size:15px;color:var(--muted);margin-bottom:2rem;line-height:1.75;font-weight:300}
.cname{font-family:'Syne',system-ui,sans-serif;font-size:1.15rem;font-weight:600;color:var(--acc);margin-bottom:8px}
.ltags{display:flex;gap:6px;justify-content:center;margin-bottom:1.4rem}
.ltag{background:var(--bg4);border:1px solid var(--border);border-radius:5px;padding:4px 11px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.clinks{display:flex;flex-direction:column;gap:12px;align-items:center}
.clink{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--muted);transition:color .2s;min-height:44px;padding:2px 0}
.clink:hover{color:var(--acc)}
.ci{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--bg4);flex-shrink:0}

footer{text-align:center;padding:1.75rem 1.25rem;font-size:13px;color:var(--muted);border-top:1px solid var(--border);line-height:1.6}
</style>
</head>
