<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITSeder — מחשבון מחירים</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:   '#0A0908', bg2: '#111009', bg3: '#1A1815', bg4: '#222018',
        acc:  '#E8931E', acc2:'#4A9E7A', acc3:'#7A8EE8',
        tx:   '#DDD5C8', muted:'#9A9188',
      }
    }
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:#0A0908;color:#DDD5C8;font-family:'Inter',sans-serif;min-height:100vh}
  .mono{font-family:'JetBrains Mono',monospace}

  /* Animated counter */
  @keyframes countUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .count-anim{animation:countUp .2s ease}

  /* Device card */
  .device-card{transition:all .25s cubic-bezier(.4,0,.2,1)}
  .device-card:hover{border-color:rgba(232,147,30,.4);background:#1A1815}

  /* Qty button */
  .qty-btn{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:#DDD5C8;font-size:18px;line-height:1}
  .qty-btn:hover{border-color:#E8931E;color:#E8931E;background:rgba(232,147,30,.08)}
  .qty-btn:active{transform:scale(.92)}

  /* Total bar */
  .total-bar{background:linear-gradient(135deg,rgba(232,147,30,.12),rgba(74,158,122,.08));border:1px solid rgba(232,147,30,.25)}

  /* Tab */
  .tab{padding:10px 20px;border-radius:10px;cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;border:1px solid transparent}
  .tab.active{background:rgba(232,147,30,.15);border-color:rgba(232,147,30,.4);color:#E8931E}
  .tab:not(.active){color:#9A9188}
  .tab:not(.active):hover{color:#DDD5C8;border-color:rgba(255,255,255,.1)}

  /* Summary item */
  .sum-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .sum-row:last-child{border-bottom:none}

  /* Scroll */
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(232,147,30,.3);border-radius:2px}

  /* Pulse dot */
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .pulse{animation:pulse 2s infinite}

  /* Slide in */
  @keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
  .slide-in{animation:slideIn .3s ease forwards}
</style>
</head>
<body x-data="calculator()" x-init="init()">

<!-- Header -->
<header class="sticky top-0 z-50 border-b border-white/8 px-5 py-4 flex items-center justify-between" style="background:rgba(10,9,8,.95);backdrop-filter:blur(12px)">
  <a href="/" class="font-bold text-xl" style="font-family:Verdana,sans-serif">IT<span style="color:#E8931E">Seder</span></a>
  <div class="flex items-center gap-3">
    <div class="w-2 h-2 rounded-full bg-acc2 pulse"></div>
    <span class="text-sm text-muted">מחשבון מחירים</span>
  </div>
</header>

<div class="max-w-2xl mx-auto px-4 py-8">

  <!-- Title -->
  <div class="text-right mb-8">
    <h1 class="text-3xl font-bold text-tx mb-2">חישוב עלות שירות</h1>
    <p class="text-muted text-base">בחר את סוג השירות ואת הציוד הדרוש — המחיר יחושב אוטומטית</p>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 mb-8 justify-end">
    <div class="tab" :class="mode==='monthly'?'active':''" @click="mode='monthly'">
      📅 תשלום חודשי
    </div>
    <div class="tab" :class="mode==='hourly'?'active':''" @click="mode='hourly'">
      ⏱ עבודה לפי שעה
    </div>
  </div>

  <!-- HOURLY MODE -->
  <div x-show="mode==='hourly'" x-transition>
    <div class="rounded-2xl border border-white/8 bg-bg2 p-5 mb-4">
      <h3 class="text-lg font-bold text-right mb-4 text-tx">בחר סוג עבודה</h3>
      <div class="flex flex-col gap-3">
        <template x-for="item in hourlyItems" :key="item.id">
          <div class="device-card rounded-xl border border-white/8 bg-bg3 p-4 cursor-pointer"
            :class="item.selected ? 'border-acc/50 bg-bg3' : ''"
            @click="item.selected = !item.selected">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <!-- Hours input -->
                <div class="flex items-center gap-2" x-show="item.selected" @click.stop>
                  <button class="qty-btn" @click="item.hours = Math.max(0.5, item.hours - 0.5)">−</button>
                  <span class="mono text-acc text-base font-semibold w-12 text-center" x-text="item.hours + 'h'"></span>
                  <button class="qty-btn" @click="item.hours = item.hours + 0.5">+</button>
                </div>
                <div class="w-8 h-8 rounded-lg border border-white/8 flex items-center justify-center" x-show="!item.selected">
                  <span class="text-muted text-sm">○</span>
                </div>
                <div x-show="item.selected" class="w-8 h-8 rounded-lg bg-acc/20 border border-acc/40 flex items-center justify-center">
                  <span class="text-acc text-sm">✓</span>
                </div>
              </div>
              <div class="text-right">
                <div class="text-base font-semibold text-tx" x-text="item.name"></div>
                <div class="text-sm text-muted" x-text="'₪' + item.price + ' לשעה'"></div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- MONTHLY MODE -->
  <div x-show="mode==='monthly'" x-transition>

    <!-- Categories -->
    <template x-for="cat in categories" :key="cat.id">
      <div class="mb-5">
        <div class="flex items-center justify-end gap-2 mb-3">
          <h3 class="text-base font-semibold text-tx" x-text="cat.name"></h3>
          <span class="text-xl" x-text="cat.icon"></span>
        </div>
        <div class="flex flex-col gap-2">
          <template x-for="device in cat.devices" :key="device.id">
            <div class="device-card rounded-xl border border-white/8 bg-bg2 p-4">
              <div class="flex items-center justify-between">
                <!-- Qty controls -->
                <div class="flex items-center gap-3">
                  <button class="qty-btn" @click="device.qty = Math.max(0, device.qty - 1)">−</button>
                  <span class="mono font-semibold text-base w-6 text-center"
                    :class="device.qty > 0 ? 'text-acc' : 'text-muted'"
                    x-text="device.qty"></span>
                  <button class="qty-btn" @click="device.qty++">+</button>
                </div>
                <!-- Info -->
                <div class="text-right flex-1 mr-3">
                  <div class="text-base font-semibold text-tx" x-text="device.name"></div>
                  <div class="text-sm text-muted" x-text="'₪' + device.price + ' לחודש'"></div>
                </div>
                <!-- Icon -->
                <span class="text-2xl flex-shrink-0" x-text="device.icon"></span>
              </div>
              <!-- Subtotal -->
              <div x-show="device.qty > 0" x-transition class="mt-3 pt-3 border-t border-white/6 flex justify-between items-center">
                <span class="mono text-acc font-semibold text-sm" x-text="'₪' + (device.qty * device.price).toLocaleString()"></span>
                <span class="text-xs text-muted" x-text="device.qty + ' × ₪' + device.price"></span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- TOTAL BAR -->
  <div class="total-bar rounded-2xl p-5 sticky bottom-4 mt-6" x-show="total > 0" x-transition>
    <!-- Summary -->
    <div class="mb-4" x-show="summaryItems.length > 0">
      <template x-for="item in summaryItems" :key="item.name">
        <div class="sum-row">
          <span class="mono text-sm text-acc">₪<span x-text="item.subtotal.toLocaleString()"></span></span>
          <span class="text-sm text-muted" x-text="item.name"></span>
        </div>
      </template>
    </div>

    <!-- Total -->
    <div class="flex items-center justify-between">
      <div class="flex gap-3">
        <!-- WhatsApp -->
        <a :href="whatsappLink" target="_blank"
          class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all"
          style="background:#25D366;color:#000">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          שלח
        </a>
      </div>
      <div class="text-right">
        <div class="text-xs text-muted mb-1" x-text="mode==='monthly' ? 'סה״כ לחודש' : 'סה״כ לעבודה'"></div>
        <div class="mono text-2xl font-bold text-acc count-anim" x-text="'₪' + total.toLocaleString()"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div x-show="total === 0" class="text-center py-16 text-muted">
    <div class="text-5xl mb-4" x-text="mode==='monthly' ? '🖥️' : '⏱️'"></div>
    <p class="text-base" x-text="mode==='monthly' ? 'הוסף מכשירים כדי לחשב את המחיר' : 'בחר סוג עבודה כדי לחשב את המחיר'"></p>
  </div>

</div>

<script>
function calculator(){
  return {
    mode: 'monthly',

    hourlyItems: [
      {id:'pc-win',  name:'מחשב / לפטופ (Windows)',  price:100, hours:1, selected:false},
      {id:'pc-mac',  name:'מחשב / לפטופ (Mac)',       price:100, hours:1, selected:false},
      {id:'pc-lin',  name:'מחשב / לפטופ (Linux)',     price:100, hours:1, selected:false},
      {id:'server',  name:'שרת / ציוד רשת',           price:100, hours:1, selected:false},
      {id:'network', name:'ארון תקשורת / Rack',        price:100, hours:1, selected:false},
      {id:'onsite',  name:'ביקור פיזי (נסיעה)',        price:100, hours:1, selected:false},
    ],

    categories: [
      {
        id:'workstations', name:'תחנות עבודה', icon:'💻',
        devices:[
          {id:'win',  name:'Windows',        icon:'🪟', price:100, qty:0},
          {id:'mac',  name:'macOS',           icon:'🍎', price:100, qty:0},
          {id:'lin',  name:'Linux',           icon:'🐧', price:100, qty:0},
        ]
      },
      {
        id:'servers', name:'שרתים', icon:'🖥️',
        devices:[
          {id:'srv-win',  name:'Windows Server',  icon:'🗄️', price:100, qty:0},
          {id:'srv-lin',  name:'Linux Server',     icon:'🗄️', price:100, qty:0},
          {id:'nas',      name:'NAS / Storage',    icon:'💾', price:100, qty:0},
        ]
      },
      {
        id:'network', name:'ציוד רשת', icon:'🔌',
        devices:[
          {id:'switch',   name:'Switch',           icon:'🔀', price:100, qty:0},
          {id:'router',   name:'Router / Firewall', icon:'🛡️', price:100, qty:0},
          {id:'ap',       name:'Access Point WiFi', icon:'📡', price:100, qty:0},
          {id:'rack',     name:'ארון תקשורת',       icon:'🗃️', price:100, qty:0},
        ]
      },
      {
        id:'other', name:'אחר', icon:'🔧',
        devices:[
          {id:'printer',  name:'מדפסת / MFP',      icon:'🖨️', price:100, qty:0},
          {id:'cam',      name:'מצלמת אבטחה',       icon:'📷', price:100, qty:0},
          {id:'phone',    name:'טלפון IP',           icon:'📞', price:100, qty:0},
        ]
      },
    ],

    get total(){
      if(this.mode === 'hourly'){
        return this.hourlyItems.filter(i=>i.selected).reduce((s,i)=>s+i.price*i.hours,0);
      }
      return this.categories.reduce((s,c)=>s+c.devices.reduce((ss,d)=>ss+d.price*d.qty,0),0);
    },

    get summaryItems(){
      if(this.mode === 'hourly'){
        return this.hourlyItems.filter(i=>i.selected).map(i=>({
          name: i.name + ' × ' + i.hours + 'h',
          subtotal: i.price * i.hours
        }));
      }
      const items = [];
      this.categories.forEach(c=>{
        c.devices.forEach(d=>{
          if(d.qty>0) items.push({name: d.name+' × '+d.qty, subtotal: d.price*d.qty});
        });
      });
      return items;
    },

    get whatsappLink(){
      const lines = this.summaryItems.map(i=>`• ${i.name} — ₪${i.subtotal}`).join('%0A');
      const total = `סה״כ: ₪${this.total}`;
      const type = this.mode==='monthly' ? 'תשלום חודשי' : 'עבודה לפי שעה';
      return `https://wa.me/972525983311?text=שלום,%20אני%20מעוניין%20ב${type}:%0A${lines}%0A${total}`;
    },

    init(){
      // nothing yet
    }
  }
}
</script>

</body>
</html>
